[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "removebg-local"
version = "0.1.0"
description = "Local GPU video and photo background removal"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.7,<3", "torchvision>=0.22,<1",
  "transformers==4.57.6", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "av>=16,<18", "imageio-ffmpeg>=0.6,<0.7",
  "numpy>=2,<3", "Pillow>=11,<13", "huggingface-hub>=0.34,<1",
  "requests>=2.32,<3", "playwright>=1.56,<2",
  "yt-dlp==2026.10.26", "yt-dlp-ejs==0.8.0", "gallery-dl==1.32.19",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
removebg = "removebg.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
